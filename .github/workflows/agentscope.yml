name: Agentscope Auto Login

on:
  workflow_dispatch:   # 由 cron-job.org 调度触发

permissions:
  actions: write
  contents: read

concurrency:
  group: agentscope-auto
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei fonts-noto-cjk
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run script
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          AGENTSCOPE_USERNAME: ${{ secrets.AGENTSCOPE_USERNAME }}
          AGENTSCOPE_PASSWORD: ${{ secrets.AGENTSCOPE_PASSWORD }}
          HEADLESS: 'true'
          BUTTON_DEPLOY: '一键部署 QwenPaw,一键部署QwenPaw'
          BUTTON_QWENPAW: '打开QWENPAW,打开 QWENPAW,Open QWENPAW'
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # ---- cron-job.org 调度用 ----
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ secrets.REPO_OWNER }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
          WORKFLOW_FILE: ${{ secrets.WORKFLOW_FILE }}
          BRANCH: ${{ secrets.BRANCH }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
        run: python agentscope_login.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: '*.png'
          retention-days: 2
          if-no-files-found: ignore

      - name: Cleanup old runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 2
