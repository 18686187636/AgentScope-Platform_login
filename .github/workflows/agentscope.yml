name: Agentscope Auto Login

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: agentscope-auto
  cancel-in-progress: false

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei fonts-noto-cjk
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run script
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          AGENTSCOPE_USERNAME: ${{ secrets.AGENTSCOPE_USERNAME }}
          AGENTSCOPE_PASSWORD: ${{ secrets.AGENTSCOPE_PASSWORD }}
          HEADLESS: 'true'
          BUTTON_DEPLOY: '一键部署 QwenPaw,一键部署QwenPaw'
          BUTTON_QWENPAW: '打开QWENPAW,打开 QWENPAW,Open QWENPAW'
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python agentscope_login.py

      # 只在失败时上传，避免每天 490MB 撞额度
      - name: Upload screenshots (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: '*.png'
          retention-days: 1
          if-no-files-found: ignore

      # 只在手动触发时清理，避免每 20 分钟浪费 2 分钟
      - name: Cleanup old runs (manual only)
        if: github.event_name == 'workflow_dispatch'
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 3
          keep_minimum_runs: 72
